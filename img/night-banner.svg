<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- 夜空：深蓝渐变 -->
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1f"/>
      <stop offset="0.5" stop-color="#0d1730"/>
      <stop offset="0.85" stop-color="#16264a"/>
      <stop offset="1" stop-color="#22345c"/>
    </linearGradient>
    <!-- 月亮光晕 -->
    <radialGradient id="moonglow" cx="0.599" cy="0.352" r="0.3">
      <stop offset="0" stop-color="#f6f1d5" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#f6f1d5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f6f1d5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <!-- 星星：疏密两层 -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2" opacity="0.9"/><circle cx="260" cy="200" r="1.4" opacity="0.5"/>
    <circle cx="380" cy="70" r="1.8" opacity="0.8"/><circle cx="500" cy="260" r="1.2" opacity="0.4"/>
    <circle cx="620" cy="140" r="2.2" opacity="0.95"/><circle cx="720" cy="60" r="1.3" opacity="0.5"/>
    <circle cx="840" cy="220" r="1.6" opacity="0.7"/><circle cx="960" cy="90" r="1.2" opacity="0.45"/>
    <circle cx="1080" cy="180" r="2" opacity="0.85"/><circle cx="1180" cy="60" r="1.4" opacity="0.55"/>
    <circle cx="90" cy="330" r="1.5" opacity="0.6"/><circle cx="220" cy="430" r="1.2" opacity="0.4"/>
    <circle cx="430" cy="380" r="1.8" opacity="0.75"/><circle cx="560" cy="480" r="1.2" opacity="0.4"/>
    <circle cx="700" cy="420" r="1.5" opacity="0.6"/><circle cx="1010" cy="350" r="1.3" opacity="0.5"/>
    <circle cx="1240" cy="300" r="1.7" opacity="0.7"/><circle cx="90" cy="560" r="1.3" opacity="0.45"/>
    <circle cx="300" cy="620" r="1.6" opacity="0.55"/><circle cx="520" cy="590" r="1.2" opacity="0.4"/>
    <circle cx="760" cy="560" r="1.4" opacity="0.5"/><circle cx="1120" cy="500" r="1.2" opacity="0.4"/>
    <circle cx="1330" cy="430" r="1.6" opacity="0.6"/><circle cx="1700" cy="380" r="1.5" opacity="0.55"/>
    <circle cx="1820" cy="150" r="1.8" opacity="0.8"/><circle cx="1600" cy="90" r="1.4" opacity="0.55"/>
    <circle cx="1500" cy="200" r="1.3" opacity="0.5"/><circle cx="1880" cy="480" r="1.4" opacity="0.5"/>
    <circle cx="1760" cy="560" r="1.2" opacity="0.4"/><circle cx="1420" cy="540" r="1.3" opacity="0.45"/>
    <circle cx="640" cy="300" r="1.1" opacity="0.35"/><circle cx="1350" cy="120" r="1.2" opacity="0.45"/>
  </g>

  <!-- 几颗亮星带十字星光 -->
  <g fill="#ffffff">
    <g transform="translate(320,150)">
      <circle r="3"/><rect x="-12" y="-0.8" width="24" height="1.6" opacity="0.6"/><rect x="-0.8" y="-12" width="1.6" height="24" opacity="0.6"/>
    </g>
    <g transform="translate(880,140)">
      <circle r="2.6"/><rect x="-10" y="-0.7" width="20" height="1.4" opacity="0.55"/><rect x="-0.7" y="-10" width="1.4" height="20" opacity="0.55"/>
    </g>
    <g transform="translate(1290,240)">
      <circle r="2.8"/><rect x="-11" y="-0.7" width="22" height="1.4" opacity="0.55"/><rect x="-0.7" y="-11" width="1.4" height="22" opacity="0.55"/>
    </g>
  </g>

  <!-- 月亮：柔和光晕 + 月牙（蒙版挖出真月牙，光晕透出） -->
  <rect width="1920" height="1080" fill="url(#moonglow)"/>
  <mask id="crescent">
    <circle cx="1150" cy="380" r="78" fill="#ffffff"/>
    <circle cx="1182" cy="362" r="72" fill="#000000"/>
  </mask>
  <circle cx="1150" cy="380" r="78" fill="#f6f1d5" opacity="0.95" mask="url(#crescent)"/>

  <!-- 远处淡淡的夜云剪影 -->
  <g fill="#1c2c50" opacity="0.5" filter="url(#soft)">
    <ellipse cx="400" cy="880" rx="320" ry="40"/>
    <ellipse cx="1100" cy="930" rx="380" ry="46"/>
    <ellipse cx="1680" cy="890" rx="300" ry="38"/>
  </g>
</svg>
